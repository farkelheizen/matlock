[project]
name = "matlock"
version = "0.1.0"
description = "Pipeline-driven task extractor and report generator for Markdown second brains"
authors = [
    {name = "farkelheizen",email = "billspratley@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "marko (>=2.2.2,<3.0.0)",
    "pytimeparse (>=1.1.8,<2.0.0)",
    "python-frontmatter (>=1.1.0,<2.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "typer[all] (>=0.25.0,<0.26.0)"
]

[project.scripts]
matlock = "matlock.cli:app"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

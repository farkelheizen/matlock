[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matlock"
version = "2.0.0"
description = "Local Markdown indexing and modular SQLite search tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.7,<1",
    "PyYAML>=6,<7",
    "sqlite-vec>=0.1.6,<1",
    "tokenizers>=0.21,<1",
    "watchdog>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "detect-secrets>=1.5,<2", "pydantic>=2,<3"]
mcp = ["fastmcp>=2.14,<3"]
audit = ["detect-secrets>=1.5,<2", "pydantic>=2,<3"]
audit-llm = ["pydantic>=2,<3", "transformers>=4.56", "torch>=2.2"]

[project.scripts]
matlock = "matlock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

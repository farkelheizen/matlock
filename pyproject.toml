[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matlock2"
version = "0.1.0"
description = "Local Markdown ingestion engine backed by SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.7,<1",
    "PyYAML>=6,<7",
    "sqlite-vec>=0.1.6,<1",
    "tokenizers>=0.21,<1",
    "watchdog>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
matlock2 = "matlock2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
